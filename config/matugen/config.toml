[config]

[templates.phantom-bar]
input_path = '~/.config/matugen/templates/phantom-bar.json'
output_path = '~/.config/matugen/phantom-bar.json'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/current-theme.conf'
post_hook = 'pkill -SIGUSR1 kitty || true'

[templates.cava]
input_path = '~/.config/matugen/templates/cava'
output_path = '~/.config/cava/config'
post_hook = 'pkill -SIGUSR2 cava || true'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch.fish'
output_path = '~/.config/fish/conf.d/matugen-fastfetch.fish'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -SIGUSR2 btop || true'

[templates.peaclock]
input_path = '~/.config/matugen/templates/peaclock'
output_path = '~/.config/peaclock/config'
post_hook = 'pkill -USR1 -x peaclock || true'

[templates.hyprborder]
input_path = '~/.config/matugen/templates/border-colors.txt'
output_path = '~/.config/hypr/border-colors.txt'
post_hook = '$HOME/.local/bin/border-sync'
