name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x install.sh sync.sh install/lib/*.sh
      - name: Python scripts compile
        run: |
          for f in bin/*; do
            if head -n1 "$f" | grep -q python; then python3 -m py_compile "$f"; fi
          done
      - name: Installer dry run
        run: |
          printf 'ID=arch\nNAME="Arch Linux"\n' > "$RUNNER_TEMP/arch-os-release"
          OS_RELEASE="$RUNNER_TEMP/arch-os-release" SHADOWS_ALLOW_ROOT=1 ./install.sh --yes --dry-run
      - name: Distribution detection and rejection
        run: |
          mkdir -p /tmp/opencode
          python3 tests/distro-support.py
